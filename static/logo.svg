<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#fe2c55" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Red/Pink Gradient -->
    <linearGradient id="magenta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0050" />
      <stop offset="100%" stop-color="#fe2c55" />
    </linearGradient>

    <!-- Radar Pulse Ring -->
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#00f2fe" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Glow -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="8" filter="url(#drop-shadow)" />

  <!-- Radar Grid Circles (Background) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="70" fill="url(#radar-glow)"/>

  <!-- Scanning Beam Effect -->
  <path d="M 256 256 L 390 120 A 190 190 0 0 0 256 66 Z" fill="url(#radar-glow)" opacity="0.4"/>

  <!-- TIKTOK NOTE WITH CHROMATIC ABERRATION -->
  <g transform="translate(-10, -10)">
    <!-- Cyan Shadow Layer (Left) -->
    <path d="M 285 105 C 305 140 338 165 378 170 L 378 220 C 348 218 322 206 300 188 L 300 312 C 300 365 258 408 205 408 C 152 408 110 365 110 312 C 110 259 152 216 205 216 C 215 216 225 218 235 221 L 235 273 C 226 269 216 267 205 267 C 180 267 160 287 160 312 C 160 337 180 357 205 357 C 230 357 250 337 250 312 L 250 105 Z" 
          fill="#00f2fe" opacity="0.85" filter="url(#neon-glow)" />

    <!-- Magenta Shadow Layer (Right) -->
    <path d="M 295 115 C 315 150 348 175 388 180 L 388 230 C 358 228 332 216 310 198 L 310 322 C 310 375 268 418 215 418 C 162 418 120 375 120 322 C 120 269 162 226 215 226 C 225 226 235 228 245 231 L 245 283 C 236 279 226 277 215 277 C 190 277 170 297 170 322 C 170 347 190 367 215 367 C 240 367 260 347 260 322 L 260 115 Z" 
          fill="#ff0050" opacity="0.85" filter="url(#neon-glow)" />

    <!-- Pure White Front Note -->
    <path d="M 290 110 C 310 145 343 170 383 175 L 383 225 C 353 223 327 211 305 193 L 305 317 C 305 370 263 413 210 413 C 157 413 115 370 115 317 C 115 264 157 221 210 221 C 220 221 230 223 240 226 L 240 278 C 231 274 221 272 210 272 C 185 272 165 292 165 317 C 165 342 185 362 210 362 C 235 362 255 342 255 317 L 255 110 Z" 
          fill="#ffffff" />
  </g>

  <!-- SHIELD / DEDUP CHECKMARK BADGE (Bottom Right) -->
  <g transform="translate(290, 290)" filter="url(#drop-shadow)">
    <!-- Shield Outer Ring -->
    <circle cx="90" cy="90" r="85" fill="#0b1120" stroke="url(#shield-grad)" stroke-width="7" />
    
    <!-- Shield Inner Fill -->
    <circle cx="90" cy="90" r="70" fill="url(#bg-grad)" />

    <!-- Pulse radar waves -->
    <circle cx="90" cy="90" r="55" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" stroke-dasharray="4 4" />

    <!-- Glowing Checkmark / Search Symbol -->
    <path d="M 62 92 L 82 112 L 122 68" fill="none" stroke="url(#shield-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
    <path d="M 62 92 L 82 112 L 122 68" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 60 110 L 60 60 L 110 60" fill="none" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 452 110 L 452 60 L 402 60" fill="none" stroke="#ff0050" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 60 402 L 60 452 L 110 452" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
